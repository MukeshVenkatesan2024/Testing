name: Import Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  import-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import issues from CSV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import csv
          import os
          import subprocess
          import sys
          import time

          CSV_FILE = "github_issues.csv"
          REPO = os.environ["GH_REPO"]

          if not os.path.exists(CSV_FILE):
              print(f"ERROR: {CSV_FILE} not found")
              sys.exit(1)

          def run_command(command):
              result = subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(result.stderr)
                  return None

              return result.stdout.strip()

          # --------------------------------------------------
          # Read CSV
          # --------------------------------------------------

          with open(CSV_FILE, newline="", encoding="utf-8-sig") as file:
              rows = list(csv.DictReader(file))

          print(f"Found {len(rows)} issues in CSV")

          # --------------------------------------------------
          # Collect ALL labels from CSV
          # --------------------------------------------------

          all_labels = set()

          for row in rows:
              label_string = row.get("labels", "") or ""

              for label in label_string.split(","):
                  label = label.strip()

                  if label:
                      all_labels.add(label)

          print("\nLabels found in CSV:")

          for label in sorted(all_labels):
              print(f"  - {label}")

          # --------------------------------------------------
          # Get existing GitHub labels
          # --------------------------------------------------

          existing_labels_output = run_command([
              "gh", "label", "list",
              "--repo", REPO,
              "--limit", "1000",
              "--json", "name"
          ])

          existing_labels = set()

          if existing_labels_output:
              import json

              try:
                  data = json.loads(existing_labels_output)

                  for item in data:
                      existing_labels.add(item["name"])

              except Exception:
                  pass

          # --------------------------------------------------
          # Create missing labels
          # --------------------------------------------------

          print("\nChecking labels...")

          for label in sorted(all_labels):

              if label in existing_labels:
                  print(f"  EXISTS: {label}")
                  continue

              print(f"  CREATING: {label}")

              result = subprocess.run(
                  [
                      "gh",
                      "label",
                      "create",
                      label,
                      "--repo",
                      REPO,
                      "--color",
                      "ededed"
                  ],
                  text=True,
                  capture_output=True
              )

              if result.returncode == 0:
                  print(f"  CREATED: {label}")
                  existing_labels.add(label)
              else:
                  print(f"  WARNING: Could not create '{label}'")
                  print(result.stderr)

          # --------------------------------------------------
          # Get existing issue titles
          # --------------------------------------------------

          print("\nChecking existing issues...")

          existing_output = run_command([
              "gh",
              "issue",
              "list",
              "--repo",
              REPO,
              "--state",
              "all",
              "--limit",
              "1000",
              "--json",
              "title"
          ])

          existing_titles = set()

          if existing_output:
              import json

              try:
                  data = json.loads(existing_output)

                  for issue in data:
                      existing_titles.add(issue["title"].strip())

              except Exception:
                  pass

          # --------------------------------------------------
          # Import issues
          # --------------------------------------------------

          print("\n================================")
          print("Starting issue import")
          print("================================\n")

          created = 0
          skipped = 0
          failed = 0

          for number, row in enumerate(rows, start=1):

              title = (row.get("title") or "").strip()
              body = (row.get("body") or "").strip()
              label_string = (row.get("labels") or "").strip()

              if not title:
                  print(f"[{number}] SKIPPED: Empty title")
                  skipped += 1
                  continue

              # Skip duplicates
              if title in existing_titles:
                  print(f"[{number}] SKIPPED: {title}")
                  skipped += 1
                  continue

              labels = [
                  label.strip()
                  for label in label_string.split(",")
                  if label.strip()
              ]

              print(f"[{number}] Creating: {title}")

              command = [
                  "gh",
                  "issue",
                  "create",
                  "--repo",
                  REPO,
                  "--title",
                  title,
                  "--body",
                  body
              ]

              for label in labels:
                  command.extend([
                      "--label",
                      label
                  ])

              result = subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

              if result.returncode == 0:
                  print(f"    CREATED: {result.stdout.strip()}")

                  existing_titles.add(title)
                  created += 1

              else:
                  print(f"    FAILED: {title}")
                  print(result.stderr)

                  failed += 1

              # Small delay to avoid hitting API limits
              time.sleep(1)

          # --------------------------------------------------
          # Summary
          # --------------------------------------------------

          print("\n================================")
          print("IMPORT COMPLETE")
          print("================================")
          print(f"Created : {created}")
          print(f"Skipped : {skipped}")
          print(f"Failed  : {failed}")
          print("================================")

          if failed > 0:
              sys.exit(1)
          PY
