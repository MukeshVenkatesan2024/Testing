name: Import Bulk Issues from CSV

on:
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

jobs:
  import-issues:
    runs-on: ubuntu-latest
    
    # Grants permission to create issues in this repository
    permissions:
      issues: write
      contents: read

    steps:
      # Step 1: Clone the repository to access github_issues.csv
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Read CSV and bulk-create issues using the Marketplace Action
      - name: Import Issues from CSV
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: 'github_issues.csv'
          file-format: 'csv'
          github-token: ${{ secrets.GITHUB_TOKEN }}
